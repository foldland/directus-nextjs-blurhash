# yaml-language-server: $schema=https://gitlab.com/gitlab-org/gitlab/-/raw/master/app/assets/javascripts/editor/schema/ci.json

include:
  - project: tools/shared-pipelines
    ref: v7.0.3
    file: /base/base.yaml
    inputs:
      ignored_licenses:
        - BlueOak-1.0.0
        - BUSL-1.1
        - LGPL-3.0-only
        - LGPL-3.0-or-later
  - project: tools/shared-pipelines
    ref: v7.0.3
    file: /nodejs/nodejs.yaml
  - project: tools/shared-pipelines
    ref: v7.0.3
    file: /docker/docker.yaml

# Prepare
prepare-precache:
  extends: .prepare-nodejs-precache

# Audit
audit-licenses:
  extends: .audit-nodejs-licenses

audit-security:
  extends: .audit-nodejs-security

# Analysis - style
analysis-lint:
  extends: .analysis-nodejs-lint

analysis-format:
  extends: .analysis-nodejs-format

analysis-typescript:
  extends: .analysis-nodejs-typescript

# Build
build:
  extends: .build-nodejs-pnpm

# Publish
publish-npm-preview:
  extends: .publish-nodejs-pnpm-preview

publish-npm-production:
  extends: .publish-nodejs-pnpm-production

publish-docker-preview:
  extends: .publish-docker-preview
  variables:
    DOCKERFILE: Dockerfile

publish-container-production:
  extends: .publish-docker-production
  variables:
    DOCKERFILE: Dockerfile

# Test - e2e
test-e2e:
  extends: .test-e2e-nodejs-directus

# Release
release-prepare-mr:
  extends: .release-prepare-mr

release-tag:
  extends: .release-tag
