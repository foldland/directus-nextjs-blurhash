name: directus-nextjs-blurhash
services:
    database:
        image: docker.io/postgis/postgis:18-master@sha256:c23233023cf91516e22bd160b165e74a834d73dfb85b33efb6096304ffa2fa82
        platform: linux/amd64
        volumes:
            - ${DATABASE_VOLUME:-./data/database}:/var/lib/postgresql
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_DATABASE}
        healthcheck:
            test:
                [
                    "CMD",
                    "pg_isready",
                    "-U",
                    "${DB_USER}",
                    "-d",
                    "${DB_DATABASE}",
                    "-h",
                    "localhost",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_interval: 5s
            start_period: 30s

    cache:
        image: docker.io/redis:8@sha256:4d25e2fe601f7ffaeb4437cb6ced3518bc36edf34ebe98863c80836943d94529
        healthcheck:
            test: ["CMD-SHELL", "[ $$(redis-cli ping) = 'PONG' ]"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_interval: 5s
            start_period: 30s

    directus:
        image: docker.io/directus/directus:11.17@sha256:eb326f679ae847c0a776f93b972761dc2ebe84980e0b9d274a6bc31cd62809f7
        # build:
        #     context: ../
        #     dockerfile: ./Dockerfile
        ports:
            - ${DIRECTUS_PORT}:8055
        volumes:
            - ${UPLOADS_VOLUME:-./uploads}:/directus/uploads
            - ${EXTENSIONS_VOLUME:-./extensions}:/directus/extensions
            # Local extension development
            - ../:/directus/extensions/@foldland-directus-nextjs-blurhash
        depends_on:
            database:
                condition: service_healthy
            cache:
                condition: service_healthy
        env_file:
            - .env
        environment:
            SECRET: ${DIRECTUS_SECRET}

            DB_CLIENT: "pg"
            DB_HOST: "database"
            DB_PORT: "5432"

            CACHE_STORE: "redis"
            REDIS: "redis://cache:6379"
        extra_hosts:
            - "host.docker.internal:host-gateway"

volumes:
    extensions:
    uploads:
    database:
