name: directus-nextjs-blurhash
services:
    database:
        image: docker.io/postgis/postgis:18-master@sha256:9ee29e5294df98822903f94225e63f265f0de22eef51e85ceea2dfd849e5c106
        platform: linux/amd64
        volumes:
            - ${DATABASE_VOLUME:-./data/database}:/var/lib/postgresql
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_DATABASE}
        healthcheck:
            test:
                [
                    "CMD",
                    "pg_isready",
                    "-U",
                    "${DB_USER}",
                    "-d",
                    "${DB_DATABASE}",
                    "-h",
                    "localhost",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_interval: 5s
            start_period: 30s

    cache:
        image: docker.io/redis:8@sha256:691577adaf11927f4bb8871d40a5dd69a5c300d4453b742e8f6383c3e6e8d2e1
        healthcheck:
            test: ["CMD-SHELL", "[ $$(redis-cli ping) = 'PONG' ]"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_interval: 5s
            start_period: 30s

    directus:
        image: docker.io/directus/directus:12.3@sha256:568861dc03396477d0829897936731d861a3aa8ca68516a1422d68b4d3752621
        # build:
        #     context: ../
        #     dockerfile: ./Dockerfile
        ports:
            - ${DIRECTUS_PORT}:8055
        volumes:
            - ${UPLOADS_VOLUME:-./uploads}:/directus/uploads
            - ${EXTENSIONS_VOLUME:-./extensions}:/directus/extensions
            # Local extension development
            - ../:/directus/extensions/@foldland-directus-nextjs-blurhash
        depends_on:
            database:
                condition: service_healthy
            cache:
                condition: service_healthy
        env_file:
            - .env
        environment:
            SECRET: ${DIRECTUS_SECRET}

            DB_CLIENT: "pg"
            DB_HOST: "database"
            DB_PORT: "5432"

            CACHE_STORE: "redis"
            REDIS: "redis://cache:6379"
        extra_hosts:
            - "host.docker.internal:host-gateway"

volumes:
    extensions:
    uploads:
    database:
