name: directus-nextjs-blurhash
services:
    database:
        image: docker.io/postgis/postgis:18-master@sha256:6af934bfb961b321feb9d8c10d29861d64809fcf3a03f1666deb30db88a6918d
        platform: linux/amd64
        volumes:
            - ${DATABASE_VOLUME:-./data/database}:/var/lib/postgresql
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_DATABASE}
        healthcheck:
            test:
                [
                    "CMD",
                    "pg_isready",
                    "-U",
                    "${DB_USER}",
                    "-d",
                    "${DB_DATABASE}",
                    "-h",
                    "localhost",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_interval: 5s
            start_period: 30s

    cache:
        image: docker.io/redis:8@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6
        healthcheck:
            test: ["CMD-SHELL", "[ $$(redis-cli ping) = 'PONG' ]"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_interval: 5s
            start_period: 30s

    directus:
        image: docker.io/directus/directus:12.5@sha256:7de5d6898b955dab1672619aed590035dcade4f8d7396d913e55543e114d1331
        # build:
        #     context: ../
        #     dockerfile: ./Dockerfile
        ports:
            - ${DIRECTUS_PORT}:8055
        volumes:
            - ${UPLOADS_VOLUME:-./uploads}:/directus/uploads
            - ${EXTENSIONS_VOLUME:-./extensions}:/directus/extensions
            # Local extension development
            - ../:/directus/extensions/@foldland-directus-nextjs-blurhash
        depends_on:
            database:
                condition: service_healthy
            cache:
                condition: service_healthy
        env_file:
            - .env
        environment:
            SECRET: ${DIRECTUS_SECRET}

            DB_CLIENT: "pg"
            DB_HOST: "database"
            DB_PORT: "5432"

            CACHE_STORE: "redis"
            REDIS: "redis://cache:6379"
        extra_hosts:
            - "host.docker.internal:host-gateway"

volumes:
    extensions:
    uploads:
    database:
