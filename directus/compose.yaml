name: directus-nextjs-blurhash
services:
    database:
        image: docker.io/postgis/postgis:18-master@sha256:820f4f6ee0742c9d70f3e3d0c11dedeb6f5aa0aac3b3312a465df12025ae8582
        platform: linux/amd64
        volumes:
            - ${DATABASE_VOLUME:-./data/database}:/var/lib/postgresql
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_DATABASE}
        healthcheck:
            test:
                [
                    "CMD",
                    "pg_isready",
                    "-U",
                    "${DB_USER}",
                    "-d",
                    "${DB_DATABASE}",
                    "-h",
                    "localhost",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_interval: 5s
            start_period: 30s

    cache:
        image: docker.io/redis:8@sha256:298e5b3bc566bade82f46ad5511777a4a07a294097ce16ada2f6a42be5239df5
        healthcheck:
            test: ["CMD-SHELL", "[ $$(redis-cli ping) = 'PONG' ]"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_interval: 5s
            start_period: 30s

    directus:
        image: docker.io/directus/directus:12.3@sha256:8978edf633ae28aa31464bb71c55300c94d8bc771ff3727b5fac485173283869
        # build:
        #     context: ../
        #     dockerfile: ./Dockerfile
        ports:
            - ${DIRECTUS_PORT}:8055
        volumes:
            - ${UPLOADS_VOLUME:-./uploads}:/directus/uploads
            - ${EXTENSIONS_VOLUME:-./extensions}:/directus/extensions
            # Local extension development
            - ../:/directus/extensions/@foldland-directus-nextjs-blurhash
        depends_on:
            database:
                condition: service_healthy
            cache:
                condition: service_healthy
        env_file:
            - .env
        environment:
            SECRET: ${DIRECTUS_SECRET}

            DB_CLIENT: "pg"
            DB_HOST: "database"
            DB_PORT: "5432"

            CACHE_STORE: "redis"
            REDIS: "redis://cache:6379"
        extra_hosts:
            - "host.docker.internal:host-gateway"

volumes:
    extensions:
    uploads:
    database:
