minimumReleaseAge: 4320 # 3 days - same as renovate
minimumReleaseAgeExclude:
    - "@debacode-public/*"
    - lodash-es@4.17.24
    - axios@1.15.2
    - fast-xml-builder@1.1.7

# Dependency resolution
savePrefix: "^"
resolutionMode: "highest"
strictPeerDependencies: true
preferFrozenLockfile: true

# node version
engineStrict: true
ignorePnpmfile: true
# pnpm version
packageManagerStrict: true
packageManagerStrictVersion: true

# Security
blockExoticSubdeps: true
hoist: false
hoistWorkspacePackages: false
verifyDepsBeforeRun: "install"

# avoid including the linked extension
packages:
    - "!directus/**"

overrides:
    # broken directus peers
    "@vitejs/plugin-vue@6.0.1": ^6.0.3
    esbuild@0.26.0: ^0.28.0
    # security issues
    axios@>=1.0.0 <1.15.2: ^1.15.2
    fast-xml-builder@ >1.0.0 <=1.1.6: ^1.1.7
    lodash-es@>=4.0.0 <=4.17.23: ^4.17.24

allowBuilds:
    esbuild: false
    sharp: false
    vue-demi: false
