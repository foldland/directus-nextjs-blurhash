# Dependency age
minimumReleaseAge: 4320 # 3 days - same as renovate
minimumReleaseAgeExclude:
  - "@foldland/*"
    # security issues
  - js-yaml@4.3.1
  - nanoid@5.1.16

registries:
  default: https://registry.npmjs.org/
  "@foldland": https://npm.registry.foldland.io

# Dependency resolution
savePrefix: "^"
resolutionMode: "highest"
strictPeerDependencies: true
preferFrozenLockfile: true

# node version
engineStrict: true
ignorePnpmfile: true
# pnpm version
packageManagerStrict: true
packageManagerStrictVersion: true

# Security
blockExoticSubdeps: true
hoist: false
hoistWorkspacePackages: false
verifyDepsBeforeRun: "install"

allowBuilds:
  esbuild: false
  vue-demi: false

# avoid including the linked extension
packages:
  - "!directus/**"

# broken peers
peerDependencyRules:
  allowedVersions:
    vite: ^8.0.0

updateConfig:
  ignoreDependencies:
    - pino
    - sharp

overrides:
  js-yaml@>=4.0.0 <4.3.1: ^4.3.1
  nanoid@>=4.0.0 <5.1.16: ^5.1.16
