# Dependency age
minimumReleaseAge: 4320 # 3 days - same as renovate
minimumReleaseAgeExclude:
  - "@foldland/*"
    # security issues

registries:
  default: https://registry.npmjs.org/
  "@foldland": https://npm.registry.foldland.io

# Dependency resolution
savePrefix: "^"
resolutionMode: "highest"
strictPeerDependencies: true
preferFrozenLockfile: true
autoDedupe: true
dedupePeers: true

# node version
engineStrict: true
ignorePnpmfile: true

# Security
lockfile:
  includeResolutionSettings: true
audit:
  level: high
blockExoticSubdeps: true
hoist: false
hoistWorkspacePackages: false
verifyDepsBeforeRun: "install"

allowBuilds:
  esbuild: false
  vue-demi: false

# broken peers
peerDependencyRules:
  allowedVersions:
    vite: ^8.0.0

updateConfig:
  ignoreDependencies:
    - pino
    - sharp

overrides:
  joi@>=18.0.0 <18.3.1: ^18.3.1
